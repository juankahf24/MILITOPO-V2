name: Export Tawba Android Toolchain

on:
  push:
    branches: [tawba-toolchain-export-20260802]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tawba-toolchain-export.yml'

permissions:
  contents: read

concurrency:
  group: tawba-toolchain-export
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36 toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Package portable toolchain
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tawba-toolchain
          mkdir -p "$root/android-sdk/platforms" "$root/android-sdk/build-tools" "$root/android-sdk/licenses"
          gradle_bin="$(readlink -f "$(command -v gradle)")"
          gradle_home="$(dirname "$(dirname "$gradle_bin")")"
          cp -a "$gradle_home" "$root/gradle-8.13"
          cp -a "$ANDROID_HOME/platforms/android-36" "$root/android-sdk/platforms/"
          cp -a "$ANDROID_HOME/build-tools/36.0.0" "$root/android-sdk/build-tools/"
          cp -a "$ANDROID_HOME/platform-tools" "$root/android-sdk/"
          cp -a "$ANDROID_HOME/licenses/." "$root/android-sdk/licenses/"
          cat > "$root/TOOLCHAIN.txt" <<EOF
          gradle_version=8.13
          java_runtime_required=17_or_newer
          compile_sdk=36
          build_tools=36.0.0
          exported_from=${RUNNER_OS}
          EOF
          "$root/gradle-8.13/bin/gradle" --version > "$root/gradle-version.txt"
          "$root/android-sdk/build-tools/36.0.0/aapt2" version > "$root/aapt2-version.txt"
          du -sh "$root" | tee "$root/size.txt"
          tar -C /tmp -cf /tmp/tawba-android-toolchain.tar tawba-toolchain
          sha256sum /tmp/tawba-android-toolchain.tar > /tmp/tawba-android-toolchain.sha256
          ls -lh /tmp/tawba-android-toolchain.tar

      - name: Upload portable toolchain
        uses: actions/upload-artifact@v4
        with:
          name: Tawba-Android-Toolchain
          path: |
            /tmp/tawba-android-toolchain.tar
            /tmp/tawba-android-toolchain.sha256
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
