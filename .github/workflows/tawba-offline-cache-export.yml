name: Export Tawba Offline Gradle Cache

on:
  push:
    branches: [tawba-toolchain-export-20260802]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tawba-offline-cache-export.yml'

permissions:
  contents: read

concurrency:
  group: tawba-offline-cache-export
  cancel-in-progress: true

jobs:
  export-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Create dependency warm-up project
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tawba-warmup
          mkdir -p "$root/app/src/main/java/com/tawba/warmup" "$root/app/src/main/res/values"
          cat > "$root/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TawbaWarmup"
          include(":app")
          EOF
          cat > "$root/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF
          cat > "$root/app/build.gradle.kts" <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }
          android {
              namespace = "com.tawba.warmup"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.tawba.warmup"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              testOptions { unitTests.isIncludeAndroidResources = true }
          }
          kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_17) } }
          dependencies {
              implementation("androidx.core:core-ktx:1.19.0")
              implementation("androidx.core:core-splashscreen:1.2.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.11.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.11.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.datastore:datastore-preferences:1.2.1")
              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")
              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
              implementation("com.batoulapps.adhan:adhan:1.2.1")
          }
          EOF
          cat > "$root/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@style/AppTheme">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > "$root/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar" /></resources>
          EOF
          cat > "$root/app/src/main/java/com/tawba/warmup/MainActivity.kt" <<'EOF'
          package com.tawba.warmup
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.compose.material3.Text
          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { Text("Tawba") }
              }
          }
          EOF

      - name: Resolve and compile all Tawba dependencies
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/tawba-warmup
          gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug assembleDebug | tee /tmp/warmup-build.log

      - name: Package offline Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tawba-gradle-cache
          mkdir -p "$root"
          cp -a "$HOME/.gradle/caches" "$root/"
          cp -a "$HOME/.gradle/native" "$root/" 2>/dev/null || true
          cp /tmp/warmup-build.log "$root/"
          du -sh "$root" | tee "$root/size.txt"
          tar -C /tmp -cf /tmp/tawba-gradle-cache.tar tawba-gradle-cache
          sha256sum /tmp/tawba-gradle-cache.tar > /tmp/tawba-gradle-cache.sha256
          ls -lh /tmp/tawba-gradle-cache.tar

      - name: Upload offline Gradle cache
        uses: actions/upload-artifact@v4
        with:
          name: Tawba-Offline-Gradle-Cache
          path: |
            /tmp/tawba-gradle-cache.tar
            /tmp/tawba-gradle-cache.sha256
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
