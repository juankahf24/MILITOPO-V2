name: Tawba Resolver Diagnostic

on:
  push:
    branches: [tawba-toolchain-export-20260802]
  pull_request:
    branches: [main]
    paths:
      - 'tawba-resolver/**'
      - '.github/workflows/tawba-resolver-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true
      - uses: android-actions/setup-android@v3
      - name: Install API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Diagnose selected dependency resolution
        working-directory: tawba-resolver
        shell: bash
        run: |
          set +e
          gradle --no-daemon --stacktrace :app:resolveSelectedTawbaDependencies > /tmp/resolver-full.log 2>&1
          status=$?
          echo "gradle_exit=$status" > /tmp/resolver-status.txt
          grep -E -A8 -B4 'FAILURE:|What went wrong:|Could not resolve|Could not find|Could not determine|Execution failed|Caused by:' /tmp/resolver-full.log | tail -n 300 > /tmp/resolver-errors.txt || true
          grep -E 'Resolving |Resolved [0-9]+ selected' /tmp/resolver-full.log > /tmp/resolver-progress.txt || true
          cat /tmp/resolver-status.txt
          cat /tmp/resolver-errors.txt
          cat /tmp/resolver-progress.txt
          exit 0
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tawba-Resolver-Diagnostic
          path: |
            /tmp/resolver-full.log
            /tmp/resolver-status.txt
            /tmp/resolver-errors.txt
            /tmp/resolver-progress.txt
          if-no-files-found: error
          retention-days: 3
