name: Tawba APK QA build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout temporary build branch
        uses: actions/checkout@v4

      - name: Reconstruct Tawba source archive
        shell: bash
        run: |
          set -euo pipefail
          cat tawba-build/min/00.b64 tawba-build/min/01.b64 tawba-build/min/02.b64 \
              tawba-build/min/03.b64 tawba-build/min/04.b64 tawba-build/min/05.b64 \
              tawba-build/min/06.b64 tawba-build/min/07.b64 tawba-build/min/08.b64 > /tmp/tawba-source.b64
          python3 - <<'PY'
          from pathlib import Path
          chunks = sorted(Path('tawba-build/remhex').glob('*.hex'))
          value = ''.join(path.read_text(encoding='utf-8').strip() for path in chunks)
          with Path('/tmp/tawba-source.b64').open('a', encoding='utf-8') as handle:
              handle.write(bytes.fromhex(value).decode('ascii'))
          PY
          base64 --decode /tmp/tawba-source.b64 > /tmp/source_minimal.tar.xz
          echo "1702ae097184e5c8625a224e015a9a1bbb57c5dadfb2876ac6dcb5f42d7a817b  /tmp/source_minimal.tar.xz" | sha256sum --check
          rm -rf Tawba
          mkdir Tawba
          tar -xJf /tmp/source_minimal.tar.xz -C Tawba
          test -f Tawba/settings.gradle.kts
          test -f Tawba/app/build.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Supply QA Arabic fonts
        shell: bash
        run: |
          set -euo pipefail
          FONT_DIR="Tawba/feature/quran/src/main/res/font"
          mkdir -p "$FONT_DIR"
          FONT_SOURCE="/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          test -f "$FONT_SOURCE"
          cp "$FONT_SOURCE" "$FONT_DIR/amiri_quran_regular.ttf"
          cp "$FONT_SOURCE" "$FONT_DIR/noto_naskh_arabic_regular.ttf"
          cp "$FONT_SOURCE" "$FONT_DIR/noto_sans_arabic_regular.ttf"

      - name: Generate complete offline Quran QA database
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import sqlite3
          import time
          import unicodedata
          import urllib.request
          from pathlib import Path

          url = 'https://api.alquran.cloud/v1/quran/quran-uthmani'
          payload = None
          last_error = None
          for attempt in range(5):
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'Tawba-QA-Builder/1.0'})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      payload = json.load(response)
                  break
              except Exception as exc:
                  last_error = exc
                  time.sleep(3 * (attempt + 1))
          if payload is None:
              raise SystemExit(f'Quran API download failed: {last_error}')

          data = payload.get('data', payload)
          surahs = data.get('surahs', [])
          if len(surahs) != 114:
              raise SystemExit(f'Expected 114 surahs, received {len(surahs)}')

          def normalize_arabic(value: str) -> str:
              value = unicodedata.normalize('NFKC', value)
              value = re.sub(r'[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]', '', value)
              return value.translate(str.maketrans({
                  'أ': 'ا', 'إ': 'ا', 'آ': 'ا', 'ٱ': 'ا',
                  'ى': 'ي', 'ؤ': 'و', 'ئ': 'ي', 'ة': 'ه',
              }))

          output = Path('Tawba/core/database/src/main/assets/databases/tawba_quran.db')
          output.parent.mkdir(parents=True, exist_ok=True)
          output.unlink(missing_ok=True)
          connection = sqlite3.connect(output)
          connection.executescript('''
          PRAGMA page_size=4096;
          PRAGMA journal_mode=DELETE;
          PRAGMA synchronous=FULL;
          CREATE TABLE corpus_metadata (key TEXT PRIMARY KEY, value TEXT NOT NULL);
          CREATE TABLE surahs (
              id INTEGER PRIMARY KEY,
              arabic_name TEXT NOT NULL,
              transliterated_name TEXT NOT NULL,
              verse_count INTEGER NOT NULL,
              has_separate_bismillah INTEGER NOT NULL
          );
          CREATE TABLE ayahs (
              global_id INTEGER PRIMARY KEY,
              surah_id INTEGER NOT NULL,
              ayah_number INTEGER NOT NULL,
              text TEXT NOT NULL,
              page INTEGER NOT NULL,
              juz INTEGER NOT NULL,
              text_sha256 TEXT NOT NULL,
              UNIQUE(surah_id, ayah_number)
          );
          CREATE TABLE ayah_search (
              global_id INTEGER PRIMARY KEY,
              normalized_text TEXT NOT NULL
          );
          CREATE INDEX idx_ayahs_surah ON ayahs(surah_id, ayah_number);
          CREATE INDEX idx_ayahs_page ON ayahs(page, global_id);
          CREATE INDEX idx_ayahs_juz ON ayahs(juz, global_id);
          ''')

          metadata = {
              'corpus_origin': url,
              'corpus_status': 'qa_build_external_uthmani_source_structurally_verified',
              'build_purpose': 'installable_QA_APK_before_phase_2',
              'canonical_identity': 'not_certified_for_release',
          }
          connection.executemany('INSERT INTO corpus_metadata(key, value) VALUES (?, ?)', metadata.items())

          count = 0
          for surah in surahs:
              ayahs = surah.get('ayahs', [])
              sid = int(surah['number'])
              connection.execute(
                  'INSERT INTO surahs VALUES (?, ?, ?, ?, ?)',
                  (sid, surah.get('name', ''), surah.get('englishName', f'Surah {sid}'), len(ayahs), 0 if sid in (1, 9) else 1),
              )
              for ayah in ayahs:
                  text = str(ayah['text']).strip()
                  global_id = int(ayah['number'])
                  number_in_surah = int(ayah['numberInSurah'])
                  page = int(ayah['page'])
                  juz = int(ayah['juz'])
                  digest = hashlib.sha256(text.encode('utf-8')).hexdigest()
                  connection.execute(
                      'INSERT INTO ayahs VALUES (?, ?, ?, ?, ?, ?, ?)',
                      (global_id, sid, number_in_surah, text, page, juz, digest),
                  )
                  connection.execute(
                      'INSERT INTO ayah_search VALUES (?, ?)',
                      (global_id, normalize_arabic(text)),
                  )
                  count += 1

          connection.commit()
          integrity = connection.execute('PRAGMA integrity_check').fetchone()[0]
          page_count = connection.execute('SELECT COUNT(DISTINCT page) FROM ayahs').fetchone()[0]
          juz_count = connection.execute('SELECT COUNT(DISTINCT juz) FROM ayahs').fetchone()[0]
          connection.close()
          if (count, page_count, juz_count, integrity) != (6236, 604, 30, 'ok'):
              raise SystemExit(f'Corpus structure invalid: ayahs={count}, pages={page_count}, juz={juz_count}, integrity={integrity}')

          db_hash = hashlib.sha256(output.read_bytes()).hexdigest()
          kotlin = Path('Tawba/core/database/src/main/kotlin/com/tawba/core/database/QuranDatabase.kt')
          source = kotlin.read_text(encoding='utf-8')
          source, replacements = re.subn(
              r'private const val EXPECTED_DATABASE_SHA256 = "[0-9a-f]{64}"',
              f'private const val EXPECTED_DATABASE_SHA256 = "{db_hash}"',
              source,
          )
          if replacements != 1:
              raise SystemExit('Unable to patch expected database SHA-256')
          kotlin.write_text(source, encoding='utf-8')
          Path('/tmp/quran-db-sha256.txt').write_text(db_hash + '\n', encoding='utf-8')
          print(f'Quran DB: {count} ayahs, 604 pages, 30 juz, SHA-256 {db_hash}')
          PY

      - name: Compile Tawba QA APK
        shell: bash
        working-directory: Tawba
        run: gradle :app:assembleQa --no-daemon --stacktrace

      - name: Verify APK package and signature
        shell: bash
        run: |
          set -euo pipefail
          APK="Tawba/app/build/outputs/apk/qa/app-qa.apk"
          test -s "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/apksigner.txt
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/aapt-badging.txt
          cp "$APK" Tawba-3.5.3-quran-qa.apk
          {
            echo "Tawba Phase 1 Part 3 — QA APK"
            echo "Built: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "Source archive SHA-256: 1702ae097184e5c8625a224e015a9a1bbb57c5dadfb2876ac6dcb5f42d7a817b"
            echo "Quran database SHA-256: $(cat /tmp/quran-db-sha256.txt)"
            echo "APK SHA-256: $(sha256sum Tawba-3.5.3-quran-qa.apk | awk '{print $1}')"
            echo
            cat /tmp/aapt-badging.txt
            echo
            cat /tmp/apksigner.txt
          } > Tawba-3.5.3-quran-qa-build-report.txt

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Tawba-3.5.3-quran-qa
          path: |
            Tawba-3.5.3-quran-qa.apk
            Tawba-3.5.3-quran-qa-build-report.txt
          if-no-files-found: error
          retention-days: 7
