name: Tawba Kotlin Build Tools Cache

on:
  push:
    branches: [tawba-toolchain-export-20260802]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tawba-kotlin-build-tools-cache.yml'

permissions:
  contents: read

concurrency:
  group: tawba-kotlin-build-tools-cache
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Create Kotlin 2.3.21 compiler warm-up project
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tawba-kotlin-warmup
          mkdir -p "$root/src/main/kotlin/com/tawba/warmup"
          cat > "$root/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { mavenCentral() } }
          rootProject.name = "TawbaKotlinWarmup"
          EOF
          cat > "$root/build.gradle.kts" <<'EOF'
          plugins {
              kotlin("jvm") version "2.3.21"
          }
          repositories { mavenCentral() }
          kotlin { jvmToolchain(17) }
          dependencies {
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1")
          }
          EOF
          cat > "$root/src/main/kotlin/com/tawba/warmup/Warmup.kt" <<'EOF'
          package com.tawba.warmup
          import kotlinx.coroutines.runBlocking
          fun main() = runBlocking { println("Tawba Kotlin cache ready") }
          EOF

      - name: Compile Kotlin and resolve internal compiler classpaths
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/tawba-kotlin-warmup
          gradle --no-daemon --stacktrace clean compileKotlin testClasses | tee /tmp/kotlin-warmup.log
          test -f build/classes/kotlin/main/com/tawba/warmup/WarmupKt.class
          find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlin" -maxdepth 2 -mindepth 2 -type d | sort | tee /tmp/kotlin-modules.txt
          grep -q 'kotlin-build-tools-compat/2.3.21' /tmp/kotlin-modules.txt
          grep -q 'kotlin-build-tools-impl/2.3.21' /tmp/kotlin-modules.txt

      - name: Package incremental Gradle cache
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tawba-kotlin-cache
          mkdir -p "$root"
          cp -a "$HOME/.gradle/caches" "$root/"
          cp -a "$HOME/.gradle/native" "$root/" 2>/dev/null || true
          cp /tmp/kotlin-warmup.log /tmp/kotlin-modules.txt "$root/"
          du -sh "$root" | tee "$root/size.txt"
          tar -C /tmp -cf /tmp/tawba-kotlin-cache.tar tawba-kotlin-cache
          sha256sum /tmp/tawba-kotlin-cache.tar > /tmp/tawba-kotlin-cache.sha256

      - name: Upload incremental Kotlin cache
        uses: actions/upload-artifact@v4
        with:
          name: Tawba-Kotlin-2.3.21-Cache
          path: |
            /tmp/tawba-kotlin-cache.tar
            /tmp/tawba-kotlin-cache.sha256
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
