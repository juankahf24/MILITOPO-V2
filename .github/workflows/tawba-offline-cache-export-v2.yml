name: Export Tawba Offline Gradle Cache V2

on:
  push:
    branches: [tawba-toolchain-export-20260802]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tawba-offline-cache-export-v2.yml'

permissions:
  contents: read

concurrency:
  group: tawba-offline-cache-export-v2
  cancel-in-progress: true

jobs:
  export-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Create dependency resolver project
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tawba-resolver
          mkdir -p "$root/app/src/main"
          cat > "$root/settings.gradle.kts" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "TawbaResolver"
          include(":app")
          EOF
          cat > "$root/build.gradle.kts" <<'EOF'
          plugins {
              id("com.android.application") version "8.13.2" apply false
              id("org.jetbrains.kotlin.android") version "2.3.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.3.21" apply false
          }
          EOF
          cat > "$root/app/build.gradle.kts" <<'EOF'
          import org.jetbrains.kotlin.gradle.dsl.JvmTarget

          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.tawba.resolver"
              compileSdk = 36
              defaultConfig {
                  applicationId = "com.tawba.resolver"
                  minSdk = 24
                  targetSdk = 36
                  versionCode = 1
                  versionName = "1"
                  testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
              }
              buildFeatures { compose = true }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              testOptions { unitTests.isIncludeAndroidResources = true }
          }

          kotlin { compilerOptions { jvmTarget.set(JvmTarget.JVM_17) } }

          dependencies {
              implementation("androidx.core:core-ktx:1.19.0")
              implementation("androidx.core:core-splashscreen:1.2.0")
              implementation("androidx.activity:activity-compose:1.13.0")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.11.0")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.11.0")
              implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.11.0")
              implementation("androidx.navigation:navigation-compose:2.9.8")
              implementation("androidx.datastore:datastore-preferences:1.2.1")
              implementation("com.batoulapps.adhan:adhan:1.2.1")

              val composeBom = platform("androidx.compose:compose-bom:2026.06.00")
              implementation(composeBom)
              androidTestImplementation(composeBom)
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.animation:animation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              debugImplementation("androidx.compose.ui:ui-tooling")
              debugImplementation("androidx.compose.ui:ui-test-manifest")

              testImplementation("junit:junit:4.13.2")
              androidTestImplementation("androidx.test:runner:1.7.0")
              androidTestImplementation("androidx.test.ext:junit:1.3.0")
              androidTestImplementation("androidx.test.espresso:espresso-core:3.7.0")
              androidTestImplementation("androidx.compose.ui:ui-test-junit4")
          }

          tasks.register("resolveAllTawbaDependencies") {
              doLast {
                  val selected = configurations.filter { it.isCanBeResolved }
                  require(selected.isNotEmpty())
                  selected.sortedBy { it.name }.forEach { configuration ->
                      println("Resolving ${configuration.name}")
                      configuration.resolve()
                  }
                  println("Resolved ${selected.size} configurations")
              }
          }
          EOF
          cat > "$root/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application />
          </manifest>
          EOF

      - name: Resolve every production and test configuration
        shell: bash
        run: |
          set -o pipefail
          cd /tmp/tawba-resolver
          gradle --no-daemon --stacktrace :app:resolveAllTawbaDependencies | tee /tmp/resolver.log
          grep -q '^Resolved ' /tmp/resolver.log

      - name: Package cache with verification log
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/tawba-gradle-cache
          mkdir -p "$root"
          cp -a "$HOME/.gradle/caches" "$root/"
          cp -a "$HOME/.gradle/native" "$root/" 2>/dev/null || true
          cp /tmp/resolver.log "$root/"
          du -sh "$root" | tee "$root/size.txt"
          tar -C /tmp -cf /tmp/tawba-gradle-cache.tar tawba-gradle-cache
          sha256sum /tmp/tawba-gradle-cache.tar > /tmp/tawba-gradle-cache.sha256
          ls -lh /tmp/tawba-gradle-cache.tar

      - name: Upload verified offline cache
        uses: actions/upload-artifact@v4
        with:
          name: Tawba-Offline-Gradle-Cache-V2
          path: |
            /tmp/tawba-gradle-cache.tar
            /tmp/tawba-gradle-cache.sha256
          if-no-files-found: error
          compression-level: 6
          retention-days: 3
