<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MILITOPO Corredor">
  <title>MILITOPO · Área del corredor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/participante-192.png">
  <style>
    :root{color-scheme:dark;--bg:#09100a;--panel:#162019;--panel2:#202c22;--line:rgba(255,255,255,.10);--cream:#eef0df;--ink:#142016;--text:#f3f2e8;--muted:#9eaa9f;--green:#2f6a3d;--green2:#9ed56f;--danger:#ff9b88}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0d160f,#080d09 72%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:max(18px,calc(env(safe-area-inset-top) + 10px)) 10px calc(24px + env(safe-area-inset-bottom))}button{font:inherit}.runner-home{width:min(760px,100%);margin:0 auto;display:grid;gap:10px}
    .runner-head{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:11px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:20px;background:#142016;box-shadow:0 14px 36px rgba(0,0,0,.24)}.runner-head img{width:54px;height:54px;border-radius:15px;object-fit:cover}.runner-head h1{margin:0;font-size:1rem;letter-spacing:.08em}.runner-head p{margin:3px 0 0;color:var(--muted);font-size:.68rem}.online{display:flex;align-items:center;gap:6px;padding:7px 9px;border-radius:999px;background:#244f2d;color:#efffe9;font-size:.58rem;font-weight:900;letter-spacing:.08em}.online i{width:8px;height:8px;border-radius:50%;background:#8cec83;box-shadow:0 0 0 3px rgba(140,236,131,.14)}
    .runner-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.runner-tabs button{min-height:52px;border:1px solid var(--line);border-radius:14px;background:#1a241c;color:#c8d0c7;font-weight:900;font-size:.70rem;letter-spacing:.03em}.runner-tabs button.is-active{background:var(--cream);color:var(--ink);border-color:var(--cream);box-shadow:0 7px 18px rgba(0,0,0,.18)}
    .runner-panel{display:none;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.runner-panel.is-active{display:block}.section-title{margin:0 0 9px;font-size:.72rem;letter-spacing:.10em;color:#dbe5d8}.identity{display:grid;grid-template-columns:48px minmax(0,1fr);gap:11px;align-items:center}.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#dce8c8;color:#1b2a14;font-weight:950;font-size:1rem}.identity strong{display:block;font-size:.9rem;overflow-wrap:anywhere}.meta{margin-top:3px;color:var(--muted);font-size:.68rem;line-height:1.35;overflow-wrap:anywhere}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.btn{min-height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#222e24;color:#f1f4e9;font-weight:900;font-size:.68rem;padding:9px 10px}.btn.primary{background:#315f39;border-color:#315f39}.btn.danger{border-color:rgba(255,155,136,.28);background:rgba(255,155,136,.08);color:#ffd9d1}.btn:disabled{opacity:.45}.status{font-size:.70rem;line-height:1.4;color:var(--muted);padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.035);margin-bottom:9px}.status.ok{color:#dff5d4;border:1px solid rgba(158,213,111,.20)}.status.err{color:#ffd0c8;border:1px solid rgba(255,142,122,.25)}
    .events{display:grid;gap:8px}.event{padding:11px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#1d2820}.event strong{display:block;font-size:.86rem}.event-meta{margin-top:3px;color:var(--muted);font-size:.65rem}.pill{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#263d2a;color:#dff5d2;font-size:.60rem;font-weight:900}.waiting{margin-top:8px;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.035);color:#c9d1c8;font-size:.67rem;line-height:1.35}.event .btn{width:100%;margin-top:8px}.details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:.69rem;line-height:1.5;color:var(--muted)}.details.show{display:block}.small{font-size:.62rem;color:var(--muted)}
    @media(max-width:430px){body{padding-left:8px;padding-right:8px}.runner-head{grid-template-columns:48px minmax(0,1fr) auto;border-radius:17px}.runner-head img{width:48px;height:48px}.online{padding:6px 7px;font-size:.52rem}.runner-panel{padding:10px}.account-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="runner-home">
    <header class="runner-head">
      <img src="icons/participante-192.png" alt="MILITOPO">
      <div><h1>MILITOPO · CORREDOR</h1><p>Tu área personal de carreras</p></div>
      <span class="online"><i></i>EN LÍNEA</span>
    </header>

    <nav class="runner-tabs" aria-label="Área del corredor">
      <button type="button" class="is-active" data-runner-tab="races">MIS CARRERAS</button>
      <button type="button" data-runner-tab="profile">MI PERFIL</button>
    </nav>

    <section class="runner-panel is-active" data-runner-panel="races">
      <h2 class="section-title">MIS CARRERAS</h2>
      <div class="status" id="rhStatus">Preparando tus carreras…</div>
      <div class="events" id="rhEvents"></div>
      <button class="btn primary" id="rhRetry" type="button" style="display:none;margin-top:9px">REINTENTAR</button>
    </section>

    <section class="runner-panel" data-runner-panel="profile" aria-live="polite">
      <h2 class="section-title">MI PERFIL</h2>
      <div class="identity">
        <div class="avatar" id="rhAvatar">…</div>
        <div><strong id="rhName">Iniciando tu sesión…</strong><div class="meta" id="rhMeta">Preparando tu cuenta.</div></div>
      </div>
      <div class="account-actions">
        <button class="btn" id="rhDetailsBtn" type="button" disabled>VER DATOS</button>
        <button class="btn danger" id="rhLogoutBtn" type="button" disabled>CERRAR SESIÓN</button>
      </div>
      <div class="details" id="rhDetails"></div>
    </section>
  </main>

  <script src="../../js/v2/firebase-config.js"></script>
  <script>
    window.__MILITOPO_RUNNER_HOME_V4_BOOTED=false;
    window.__MILITOPO_RUNNER_HOME_V4_WATCHDOG=setTimeout(function(){
      if(window.__MILITOPO_RUNNER_HOME_V4_BOOTED)return;
      var name=document.getElementById("rhName"),meta=document.getElementById("rhMeta"),status=document.getElementById("rhStatus"),retry=document.getElementById("rhRetry");
      if(name)name.textContent="No se pudo iniciar tu área";
      if(meta)meta.textContent="El módulo de Firebase no terminó de cargar.";
      if(status){status.textContent="⚠️ No se pudo cargar Firebase. Comprueba la conexión y pulsa REINTENTAR.";status.className="status err";}
      if(retry)retry.style.display="block";
    },12000);
  </script>
  <script type="module" src="./runner-home-v4.js?v=v2-r5a-runner-tabs-20261005"></script>
  <script>
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
  </script>
</body>
</html>
