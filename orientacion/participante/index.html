<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MILITOPO Corredor">
  <title>MILITOPO · Área del corredor</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/participante-192.png">
  <style>
    :root{color-scheme:dark;--bg:#081008;--panel:#102015;--panel2:#16281b;--line:rgba(240,193,106,.34);--gold:#f0c16a;--cream:#f5e6c8;--muted:#b9b09d;--green:#9ed56f;--danger:#ff8e7a}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,rgba(69,106,48,.26),transparent 38%),linear-gradient(180deg,#0b140c,#070c08 72%);color:var(--cream);font-family:"Courier New",ui-monospace,monospace}
    body{padding:max(28px,calc(env(safe-area-inset-top) + 18px)) 12px calc(34px + env(safe-area-inset-bottom));}
    button{font:inherit}.runner-home{width:min(720px,100%);margin:0 auto;display:grid;gap:14px}
    .hero,.card{border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(35,60,31,.96),rgba(17,32,20,.97));box-shadow:0 16px 42px rgba(0,0,0,.28)}
    .hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:9px;padding:22px 16px}.hero img{width:108px;height:108px;object-fit:cover;border-radius:28px;border:4px solid rgba(240,193,106,.76);background:#fff}.hero h1{margin:3px 0 0;font-size:clamp(1.75rem,8vw,2.8rem);letter-spacing:.16em;color:var(--gold)}.hero p{margin:0;color:var(--muted);font-size:.86rem;line-height:1.45}
    .card{padding:15px}.section-title{margin:0 0 10px;font-size:1rem;letter-spacing:.07em;color:#e6f6d7}.identity{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:#cde99a;color:#1b2a14;font-weight:900;font-size:1.05rem;border:2px solid rgba(240,193,106,.42)}.identity strong{display:block;font-size:.95rem;overflow-wrap:anywhere}.meta{margin-top:3px;color:var(--muted);font-size:.74rem;line-height:1.4;overflow-wrap:anywhere}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.btn{min-height:44px;border-radius:13px;border:1px solid rgba(240,193,106,.38);background:rgba(240,193,106,.11);color:#fff3d7;font-weight:900;padding:9px 11px}.btn.primary{border-color:rgba(158,213,111,.42);background:rgba(158,213,111,.16);color:#efffe8}.btn.danger{border-color:rgba(255,142,122,.35);background:rgba(255,142,122,.10);color:#ffd7cf}.btn:disabled{opacity:.45}
    .status{font-size:.78rem;line-height:1.5;color:var(--muted);padding:9px 10px;border-radius:12px;background:rgba(255,255,255,.035);margin-bottom:10px}.status.ok{color:#def5d1;border:1px solid rgba(158,213,111,.22)}.status.err{color:#ffd0c8;border:1px solid rgba(255,142,122,.28)}
    .events{display:grid;gap:9px}.event{padding:12px;border:1px solid rgba(255,255,255,.10);border-radius:15px;background:rgba(255,255,255,.035)}.event strong{display:block;font-size:.91rem}.event-meta{margin-top:4px;color:var(--muted);font-size:.72rem}.pill{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:999px;border:1px solid rgba(158,213,111,.35);color:#dff5d2;font-size:.68rem;font-weight:900}.waiting{margin-top:9px;padding:9px 10px;border-radius:12px;background:rgba(240,193,106,.08);color:#eadbbf;font-size:.75rem;line-height:1.4}.event .btn{width:100%;margin-top:9px}
    .details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:.75rem;line-height:1.55;color:var(--muted)}.details.show{display:block}.small{font-size:.7rem;color:var(--muted)}
    @media(max-width:430px){body{padding-left:9px;padding-right:9px}.hero,.card{border-radius:23px}.hero{padding:18px 11px}.hero img{width:96px;height:96px}.account-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="runner-home">
    <section class="hero">
      <img src="icons/participante-192.png" alt="MILITOPO">
      <h1>MILITOPO</h1>
      <p><strong>ÁREA DEL CORREDOR</strong><br>Tus carreras y sesiones Live V2 aparecen aquí automáticamente.</p>
    </section>

    <section class="card" aria-live="polite">
      <h2 class="section-title">👤 MI CUENTA</h2>
      <div class="identity">
        <div class="avatar" id="rhAvatar">…</div>
        <div>
          <strong id="rhName">Iniciando tu sesión…</strong>
          <div class="meta" id="rhMeta">Preparando Firebase Auth.</div>
        </div>
      </div>
      <div class="account-actions">
        <button class="btn" id="rhDetailsBtn" type="button" disabled>VER DATOS DE CUENTA</button>
        <button class="btn danger" id="rhLogoutBtn" type="button" disabled>CERRAR SESIÓN</button>
      </div>
      <div class="details" id="rhDetails"></div>
    </section>

    <section class="card">
      <h2 class="section-title">📡 LIVE V2 · MIS CARRERAS</h2>
      <div class="status" id="rhStatus">Arrancando el área del corredor…</div>
      <div class="events" id="rhEvents"></div>
      <button class="btn primary" id="rhRetry" type="button" style="display:none;margin-top:10px">REINTENTAR</button>
    </section>
  </main>

  <script src="../../js/v2/firebase-config.js"></script>
  <script type="module" src="./runner-home-v3.js?v=v2-f3a-runner-home-v3-20260923"></script>
  <script>
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
  </script>
</body>
</html>
