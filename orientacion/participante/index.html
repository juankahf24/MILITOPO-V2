<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MILITOPO">
  <title>MILITOPO</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/participante-192.png">
  <style>
    :root{color-scheme:dark;--bg:#09100a;--panel:#162019;--panel2:#202c22;--line:rgba(255,255,255,.10);--cream:#eef0df;--ink:#142016;--text:#f3f2e8;--muted:#9eaa9f;--green:#2f6a3d;--green2:#9ed56f;--danger:#ff9b88}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:linear-gradient(180deg,#0d160f,#080d09 72%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:max(18px,calc(env(safe-area-inset-top) + 10px)) 10px calc(24px + env(safe-area-inset-bottom))}button{font:inherit}.runner-home{width:min(760px,100%);margin:0 auto;display:grid;gap:10px}
    .runner-head{display:grid;grid-template-columns:68px minmax(0,1fr) minmax(92px,auto);gap:12px;align-items:center;padding:10px 12px 10px 10px;border:1px solid rgba(224,233,216,.16);border-radius:22px;background:linear-gradient(145deg,#1b2b1d,#111b13 70%);box-shadow:0 16px 40px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.04);overflow:hidden}.runner-logo{width:68px;height:68px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.08),rgba(255,255,255,.01) 72%);box-shadow:0 0 0 1px rgba(238,240,223,.12)}.runner-logo img{width:64px;height:64px;display:block;object-fit:contain;background:transparent}.runner-head h1{margin:0;font-size:1.24rem;line-height:1;letter-spacing:.15em;font-weight:950;color:#f4f2e5}.runner-account{min-width:0;display:grid;justify-items:end;gap:6px}.runner-user{display:block;max-width:132px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#f3f2e8;font-size:.70rem;font-weight:900;letter-spacing:.025em}.online{display:flex;align-items:center;justify-content:center;gap:6px;min-width:92px;padding:6px 9px;border:1px solid rgba(154,236,139,.24);border-radius:999px;background:#245b31;color:#f2ffed;font-size:.54rem;font-weight:950;letter-spacing:.08em;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}.online i{width:8px;height:8px;border-radius:50%;background:#83ed7f;box-shadow:0 0 0 3px rgba(131,237,127,.12)}
    .runner-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px}.runner-tabs button{min-height:52px;border:1px solid var(--line);border-radius:14px;background:#1a241c;color:#c8d0c7;font-weight:900;font-size:.70rem;letter-spacing:.03em}.runner-tabs button.is-active{background:var(--cream);color:var(--ink);border-color:var(--cream);box-shadow:0 7px 18px rgba(0,0,0,.18)}
    .runner-panel{display:none;padding:12px;border:1px solid var(--line);border-radius:18px;background:var(--panel)}.runner-panel.is-active{display:block}.section-title{margin:0 0 9px;font-size:.72rem;letter-spacing:.10em;color:#dbe5d8}.identity{display:grid;grid-template-columns:48px minmax(0,1fr);gap:11px;align-items:center}.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:#dce8c8;color:#1b2a14;font-weight:950;font-size:1rem}.identity strong{display:block;font-size:.9rem;overflow-wrap:anywhere}.meta{margin-top:3px;color:var(--muted);font-size:.68rem;line-height:1.35;overflow-wrap:anywhere}.account-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:11px}.btn{min-height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:#222e24;color:#f1f4e9;font-weight:900;font-size:.68rem;padding:9px 10px}.btn.primary{background:#315f39;border-color:#315f39}.btn.danger{border-color:rgba(255,155,136,.28);background:rgba(255,155,136,.08);color:#ffd9d1}.btn:disabled{opacity:.45}.status{font-size:.70rem;line-height:1.4;color:var(--muted);padding:8px 9px;border-radius:11px;background:rgba(255,255,255,.035);margin-bottom:9px}.status.ok{color:#dff5d4;border:1px solid rgba(158,213,111,.20)}.status.err{color:#ffd0c8;border:1px solid rgba(255,142,122,.25)}
    .events{display:grid;gap:8px}.event{padding:11px;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:#1d2820}.event strong{display:block;font-size:.86rem}.event-meta{margin-top:3px;color:var(--muted);font-size:.65rem}.pill{display:inline-block;margin-top:7px;padding:4px 8px;border-radius:999px;background:#263d2a;color:#dff5d2;font-size:.60rem;font-weight:900}.waiting{margin-top:8px;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.035);color:#c9d1c8;font-size:.67rem;line-height:1.35}.event .btn{width:100%;margin-top:8px}.details{display:none;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.08);font-size:.69rem;line-height:1.5;color:var(--muted)}.details.show{display:block}.small{font-size:.62rem;color:var(--muted)}
    .runner-panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-note{font-size:.52rem;font-weight:900;letter-spacing:.08em;color:#88968b}.race-tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:9px 0}.race-tabs button{min-height:40px;border:1px solid rgba(255,255,255,.10);border-radius:12px;background:#202b22;color:#b9c3b8;font-weight:950;font-size:.64rem;letter-spacing:.04em}.race-tabs button span{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:5px;padding:0 5px;border-radius:999px;background:rgba(255,255,255,.08);font-size:.58rem}.race-tabs button.is-active{background:#e9ecdd;color:#142016;border-color:#e9ecdd}.race-tabs button.is-active span{background:#315f39;color:#efffe9}.race-panel{display:none}.race-panel.is-active{display:block}.event-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.event-top .pill{margin-top:0;flex:0 0 auto}.empty-card{padding:14px;border:1px dashed rgba(255,255,255,.12);border-radius:13px;background:rgba(255,255,255,.025);display:grid;gap:3px}.empty-card strong{font-size:.76rem}.empty-card span{font-size:.64rem;color:var(--muted);line-height:1.35}.history-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.history-grid>div{padding:8px;border-radius:10px;background:rgba(255,255,255,.035)}.history-grid small{display:block;color:#8f9b91;font-size:.50rem;font-weight:900;letter-spacing:.07em}.history-grid b{display:block;margin-top:3px;font-size:.76rem}.muted-pill{background:#2a332c;color:#d7ddd6}.history-result{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px;padding:8px 10px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.025)}.history-result small{color:#8f9b91;font-size:.50rem;font-weight:900;letter-spacing:.08em}.history-result strong{font-size:.72rem;color:#f1f3e8;text-align:right}
    @media(max-width:430px){body{padding-left:8px;padding-right:8px}.runner-head{grid-template-columns:58px minmax(0,1fr) minmax(84px,auto);gap:9px;padding:9px 10px 9px 8px;border-radius:19px}.runner-logo{width:58px;height:58px}.runner-logo img{width:56px;height:56px}.runner-head h1{font-size:1.06rem;letter-spacing:.12em}.runner-user{max-width:104px;font-size:.64rem}.online{min-width:84px;padding:5px 7px;font-size:.49rem}.runner-panel{padding:10px}.account-actions{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="runner-home">
    <header class="runner-head">
      <div class="runner-logo"><img src="../assets/r1/militopo-compass-r2k.png?v=r5b1-runner-header-20261005" alt="MILITOPO"></div>
      <div><h1>MILITOPO</h1></div>
      <div class="runner-account"><strong class="runner-user" id="rhHeaderUser">Cargando…</strong><span class="online"><i></i>EN LÍNEA</span></div>
    </header>

    <nav class="runner-tabs" aria-label="Área del corredor">
      <button type="button" class="is-active" data-runner-tab="races">MIS CARRERAS</button>
      <button type="button" data-runner-tab="profile">MI PERFIL</button>
    </nav>

    <section class="runner-panel is-active" data-runner-panel="races">
      <div class="runner-panel-head"><h2 class="section-title">MIS CARRERAS</h2><span class="panel-note">CARRERAS E HISTÓRICO</span></div>
      <div class="status" id="rhStatus">Preparando tus carreras…</div>
      <nav class="race-tabs" aria-label="Carreras del corredor">
        <button type="button" class="is-active" data-race-tab="active">ACTIVAS <span id="rhActiveCount">0</span></button>
        <button type="button" data-race-tab="history">HISTÓRICO <span id="rhHistoryCount">0</span></button>
      </nav>
      <div class="race-panel is-active" data-race-panel="active"><div class="events" id="rhActiveEvents"></div></div>
      <div class="race-panel" data-race-panel="history"><div class="events" id="rhHistoryEvents"></div></div>
      <button class="btn primary" id="rhRetry" type="button" style="display:none;margin-top:9px">REINTENTAR</button>
    </section>

    <section class="runner-panel" data-runner-panel="profile" aria-live="polite">
      <h2 class="section-title">MI PERFIL</h2>
      <div class="identity">
        <div class="avatar" id="rhAvatar">…</div>
        <div><strong id="rhName">Iniciando tu sesión…</strong><div class="meta" id="rhMeta">Preparando tu cuenta.</div></div>
      </div>
      <div class="account-actions">
        <button class="btn" id="rhDetailsBtn" type="button" disabled>VER DATOS</button>
        <button class="btn danger" id="rhLogoutBtn" type="button" disabled>CERRAR SESIÓN</button>
      </div>
      <div class="details" id="rhDetails"></div>
    </section>
  </main>

  <script src="../../js/v2/firebase-config.js"></script>
  <script>
    window.__MILITOPO_RUNNER_HOME_V4_BOOTED=false;
    window.__MILITOPO_RUNNER_HOME_V4_WATCHDOG=setTimeout(function(){
      if(window.__MILITOPO_RUNNER_HOME_V4_BOOTED)return;
      var name=document.getElementById("rhName"),meta=document.getElementById("rhMeta"),status=document.getElementById("rhStatus"),retry=document.getElementById("rhRetry");
      if(name)name.textContent="No se pudo iniciar tu área";
      if(meta)meta.textContent="El módulo de Firebase no terminó de cargar.";
      if(status){status.textContent="⚠️ No se pudo cargar Firebase. Comprueba la conexión y pulsa REINTENTAR.";status.className="status err";}
      if(retry)retry.style.display="block";
    },12000);
  </script>
  <script type="module" src="./runner-home-v4.js?v=v2-r5b1-runner-header-history-20261005"></script>
  <script>
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
  </script>
</body>
</html>
