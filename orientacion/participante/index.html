<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#132114">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MILITOPO Participante">
  <title>MILITOPO · Participante</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/participante-192.png">
  <link rel="stylesheet" href="../../js/v2/auth/auth-ui.css?v=v2-f3a-runner-sessionfix-20260923">
  <style>
    :root{color-scheme:dark;--bg:#081008;--panel:#102015;--panel2:#16281b;--line:rgba(240,193,106,.34);--gold:#f0c16a;--cream:#f5e6c8;--muted:#b9b09d;--green:#9ed56f}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,rgba(69,106,48,.26),transparent 38%),linear-gradient(180deg,#0b140c,#070c08 72%);color:var(--cream);font-family:"Courier New",ui-monospace,monospace}
    body{padding:max(86px,calc(env(safe-area-inset-top) + 72px)) 16px calc(34px + env(safe-area-inset-bottom));}
    .runner-home{width:min(720px,100%);margin:0 auto;display:grid;gap:16px}
    .participant-main-hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px 18px;border:1px solid var(--line);border-radius:30px;background:linear-gradient(180deg,rgba(35,60,31,.96),rgba(17,32,20,.97));box-shadow:0 18px 46px rgba(0,0,0,.34)}
    .participant-main-hero img{width:118px;height:118px;object-fit:cover;border-radius:29px;border:4px solid rgba(240,193,106,.78);background:#fff}
    .participant-main-hero h1{margin:4px 0 0;font-size:clamp(1.8rem,8vw,3rem);letter-spacing:.16em;color:var(--gold)}
    .participant-main-hero p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.5}
    .runner-home-note{padding:14px 16px;border-radius:18px;border:1px solid rgba(158,213,111,.24);background:rgba(158,213,111,.08);color:#dff2cf;line-height:1.45;font-size:.82rem}
    .runner-home-note strong{color:#fff3d7}
    .m2-runner-v2{margin:0!important}
    #militopoV2AccountBadge{z-index:120000!important}
    @media(max-width:480px){body{padding-left:10px;padding-right:10px}.participant-main-hero{padding:20px 12px;border-radius:24px}.participant-main-hero img{width:102px;height:102px}.runner-home-note{font-size:.76rem}}
  </style>
</head>
<body data-runner-home="1">
  <main class="runner-home">
    <section class="participant-main-hero" aria-label="MILITOPO Participante">
      <img src="icons/participante-192.png" alt="MILITOPO">
      <h1>MILITOPO</h1>
      <p><strong>ÁREA DEL CORREDOR</strong><br>Tus carreras, invitaciones y sesiones Live V2 aparecen aquí automáticamente.</p>
    </section>
    <section class="runner-home-note" id="m2RunnerIdentityCard" aria-live="polite">
      <strong id="m2RunnerIdentityName">Cargando tu cuenta…</strong><br>
      <span id="m2RunnerIdentityMeta">Comprobando sesión y perfil.</span>
      <button id="m2RunnerOpenAccount" type="button" style="margin-top:12px;width:100%;min-height:44px;border-radius:14px;border:1px solid rgba(240,193,106,.38);background:rgba(240,193,106,.12);color:#fff3d7;font:inherit;font-weight:900">MI CUENTA</button>
    </section>
    <section id="m2RunnerHomePanel" class="m2-runner-v2" style="padding:15px;border-radius:22px;border:1px solid rgba(126,220,150,.34);background:linear-gradient(180deg,rgba(8,29,15,.96),rgba(5,18,9,.97));color:#f5e6c8">
      <h2 style="margin:0 0 8px;font-size:1rem;color:#e6f6d7">📡 LIVE V2 · MIS CARRERAS</h2>
      <div id="m2RunnerHomeStatus" style="font-size:.8rem;line-height:1.5;opacity:.9">Iniciando tu área personal…</div>
      <div id="m2RunnerHomeList" style="display:grid;gap:9px;margin-top:10px"></div>
    </section>
  </main>

  <script src="../../js/v2/firebase-config.js"></script>
  <script type="module" src="../../js/v2/bootstrap.js"></script>
  <script type="module" src="../../js/v2/auth/auth-ui.js?v=v2-f3a-runner-sessionfix-20260923"></script>
  <script type="module" src="../../js/v2/data/invitation-inbox.js?v=v2-f3a-runner-sessionfix-20260923"></script>
  <script type="module" src="../../js/v2/live/runner-session-v2.js?v=v2-f3a-runner-sessionfix-20260923"></script>
  <script>
    if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));}
  </script>
</body>
</html>
